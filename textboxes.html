<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Textboxes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }

        .textbox-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        #textbox1 {
            border: 2px solid #ddd;
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid #ddd;
            font-family: Arial, sans-serif;
        }

        #textbox1:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
            position: relative;
            z-index: 1;
        }

        #textbox2 {
            border: 2px solid #ff6b6b;
            border-radius: 0 0 4px 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #textbox2:focus {
            outline: none;
            border-color: #ff4757;
            box-shadow: 0 0 5px rgba(255, 107, 107, 0.3);
            position: relative;
            z-index: 1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit {
            background-color: #667eea;
            color: white;
        }

        .btn-submit:hover {
            background-color: #5568d3;
        }

        .btn-clear {
            background-color: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-clear:hover {
            background-color: #e0e0e0;
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            display: none;
        }

        .output.show {
            display: block;
        }

        .output p {
            margin-bottom: 10px;
            color: #333;
        }

        .output strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Two Textboxes Form</h1>
        
        <form id="textboxForm">
            <div class="form-group">
                <label for="textbox1">SSN:</label>
                <div class="textbox-wrapper">
                    <input type="text" id="textbox1" placeholder="">
                    <input type="text" id="textbox2" placeholder="Enter comment here">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-submit" onclick="displayValues()">Display Values</button>
                <button type="button" class="btn-clear" onclick="clearValues()">Clear</button>
            </div>
        </form>

        <div class="output" id="output">
            <p><strong>First Textbox Value:</strong> <span id="value1"></span></p>
            <p><strong>Second Textbox Value:</strong> <span id="value2"></span></p>
        </div>
    </div>

    <script>
        // Function to display values from textboxes
        function displayValues() {
            const textbox1 = document.getElementById('textbox1').value;
            const textbox2 = document.getElementById('textbox2').value;

            // Validate if textboxes are not empty
            if (textbox1.trim() === '' || textbox2.trim() === '') {
                alert('Please fill in both textboxes!');
                return;
            }

            // Display the values
            document.getElementById('value1').textContent = textbox1;
            document.getElementById('value2').textContent = textbox2;
            document.getElementById('output').classList.add('show');

            console.log('Textbox 1:', textbox1);
            console.log('Textbox 2:', textbox2);
        }

        // Function to clear textboxes and output
        function clearValues() {
            document.getElementById('textbox1').value = '';
            document.getElementById('textbox2').value = '';
            document.getElementById('output').classList.remove('show');
            document.getElementById('value1').textContent = '';
            document.getElementById('value2').textContent = '';

            console.log('Textboxes cleared');
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
                displayValues();
            }
        });

        // Log when page loads
        console.log('Form loaded successfully');
    </script>
</body>
</html>
